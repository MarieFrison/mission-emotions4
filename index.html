<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Émotions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: plateau-serpent projeté au tableau à gauche, colonne « tour de jeu » à droite ; les cartes s'ouvrent en grand au centre. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#eef2f9; --ink:#1d2340; --ink-soft:#56607f; --line:#d9e0ee;
  --brush:#1d2340; --on-brush:#ffffff;
  --m1:#3d97e8; --m1-soft:#dcecfb; --m2:#f2bd2c; --m2-soft:#fdf2cf; --m3:#4fbf6c; --m3-soft:#dcf3e2; --m4:#9b6ee0; --m4-soft:#ece2fb;
  --pink:#ef5f8a; --pink-soft:#fde3eb; --orange:#f5873a; --orange-soft:#fde8d8; --teal:#2fb8be; --red:#e8524f;
  --shadow:0 10px 30px -12px rgba(29,35,64,.28);
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-hand:"Caveat","Comic Sans MS",cursive;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12152a; --surface:#1c2140; --surface-2:#252b4f; --ink:#eef0fb; --ink-soft:#a9b0d0; --line:#343b66;
  --brush:#0b0d1d; --on-brush:#ffffff;
  --m1-soft:#1d3554; --m2-soft:#463a17; --m3-soft:#1c4129; --m4-soft:#352a55;
  --pink-soft:#4b2133; --orange-soft:#4a2f1c; --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12152a; --surface:#1c2140; --surface-2:#252b4f; --ink:#eef0fb; --ink-soft:#a9b0d0; --line:#343b66;
  --brush:#0b0d1d; --on-brush:#ffffff;
  --m1-soft:#1d3554; --m2-soft:#463a17; --m3-soft:#1c4129; --m4-soft:#352a55;
  --pink-soft:#4b2133; --orange-soft:#4a2f1c; --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 32px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--m1);outline-offset:2px}
.wrap{max-width:1280px;margin-inline:auto}

/* ---------- logo brush ---------- */
.logo{display:inline-flex;flex-direction:column;align-items:flex-start;gap:4px}
.brush{background:var(--brush);color:var(--on-brush);font-family:var(--font-display);padding:.18em .55em .12em;
  clip-path:polygon(1% 12%,8% 2%,30% 6%,55% 0,80% 5%,99% 3%,97% 40%,100% 88%,76% 97%,50% 92%,25% 100%,3% 94%,0 55%);line-height:1.05}
.rainbow span:nth-child(1){color:#ffcf3f}.rainbow span:nth-child(2){color:#ff7aa2}.rainbow span:nth-child(3){color:#ff9a4a}
.rainbow span:nth-child(4){color:#6fd08a}.rainbow span:nth-child(5){color:#55b4ff}.rainbow span:nth-child(6){color:#b892ff}
.rainbow span:nth-child(7){color:#ffcf3f}.rainbow span:nth-child(8){color:#ff7aa2}
.hand{font-family:var(--font-hand);font-weight:700}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 12px}
.topbar .brush{font-size:clamp(20px,3vw,28px)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px);background:var(--surface-2)}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--brush);color:var(--on-brush);border-color:var(--brush)}
.btn-primary:hover{background:var(--brush);filter:brightness(1.25)}
.btn-big{font-size:20px;padding:14px 26px;font-family:var(--font-display);font-weight:400;letter-spacing:.02em}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;border-color:transparent}

/* ---------- setup ---------- */
.setup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start;padding-block:12px}
.hero{display:flex;flex-direction:column;gap:18px}
.hero .brush{font-size:clamp(40px,7vw,78px)}
.hero .sub{background:var(--m2);color:#1d2340;font-family:var(--font-display);font-size:clamp(18px,2.4vw,26px);padding:4px 16px;transform:rotate(-1.2deg);align-self:flex-start;border-radius:6px}
.hero p.lead{font-size:18px;max-width:52ch;color:var(--ink-soft);margin:0}
.missions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mcard{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;border:2px solid transparent}
.mcard .tag{font-family:var(--font-display);font-size:13px;letter-spacing:.06em;background:var(--brush);color:var(--on-brush);align-self:flex-start;padding:2px 10px;border-radius:4px}
.mcard h3{font-size:22px}
.mcard p{margin:0;font-size:14px;color:var(--ink-soft)}
.mcard.z1{background:var(--m1-soft);border-color:var(--m1)}.mcard.z2{background:var(--m2-soft);border-color:var(--m2)}
.mcard.z3{background:var(--m3-soft);border-color:var(--m3)}.mcard.z4{background:var(--m4-soft);border-color:var(--m4)}
.panel{background:var(--surface);border-radius:24px;padding:22px;box-shadow:var(--shadow);border:2px solid var(--line);display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{font-size:26px}
.field-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.label{font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:900}
.seg button[aria-pressed="true"]{background:var(--brush);color:var(--on-brush)}
.team-edit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2)}
.team-edit input{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-weight:800}
.avatars{grid-column:2;display:flex;gap:4px;flex-wrap:wrap}
.avatars button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;background:var(--surface);font-size:18px;line-height:1;padding:0}
.avatars button[aria-pressed="true"]{border-color:var(--ink)}
.pawn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;border:3px solid #fff;box-shadow:0 3px 8px -2px rgba(0,0,0,.35);flex:none}
.engage{display:flex;flex-wrap:wrap;gap:6px}
.engage span{background:var(--m3-soft);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px}
.note{font-family:var(--font-hand);font-size:22px;color:var(--pink);transform:rotate(-2deg);line-height:1.1}

/* ---------- game ---------- */
.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.board-wrap{background:var(--surface);border-radius:26px;padding:16px;box-shadow:var(--shadow);border:2px solid var(--line);min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.legend .chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px 4px 4px;font-weight:800;font-size:13px}
.legend .chip b{font-family:var(--font-display);font-weight:400;color:#1d2340;border-radius:999px;padding:1px 9px}
.legend .z1{background:var(--m1-soft)}.legend .z1 b{background:var(--m1)}
.legend .z2{background:var(--m2-soft)}.legend .z2 b{background:var(--m2)}
.legend .z3{background:var(--m3-soft)}.legend .z3 b{background:var(--m3)}
.legend .z4{background:var(--m4-soft)}.legend .z4 b{background:var(--m4)}
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;position:relative}
.cell{aspect-ratio:1/0.74;border-radius:12px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;border:2px solid transparent;min-width:0;overflow:hidden}
.cell .n{position:absolute;top:3px;left:6px;font-size:11px;font-weight:900;opacity:.55}
.cell .ic{width:clamp(18px,2.6vw,30px);height:clamp(18px,2.6vw,30px)}
.cell .lab{font-family:var(--font-display);font-size:clamp(9px,1.05vw,13px);letter-spacing:.03em;text-align:center;line-height:1}
.cell.z1{background:var(--m1-soft);border-color:color-mix(in srgb,var(--m1) 45%,transparent)}
.cell.z2{background:var(--m2-soft);border-color:color-mix(in srgb,var(--m2) 55%,transparent)}
.cell.z3{background:var(--m3-soft);border-color:color-mix(in srgb,var(--m3) 45%,transparent)}
.cell.z4{background:var(--m4-soft);border-color:color-mix(in srgb,var(--m4) 45%,transparent)}
.cell.t-defi{background:var(--orange);color:#1d2340;border-color:transparent}
.cell.t-joker{background:var(--surface);border:2px dashed var(--ink-soft)}
.cell.t-parlons{background:color-mix(in srgb,var(--m3) 70%,var(--surface))}
.cell.t-retour{background:var(--pink);color:#fff;border-color:transparent}
.cell.t-chance{background:var(--m2);color:#1d2340;border-color:transparent}
.cell.t-coeur{background:var(--pink-soft);border-color:var(--pink)}
.cell.t-pause{background:color-mix(in srgb,var(--teal) 30%,var(--surface));border-color:var(--teal)}
.cell.start,.cell.end{background:var(--brush);color:var(--on-brush);border-color:transparent}
.cell.end{background:linear-gradient(135deg,#f2bd2c,#ef5f8a 55%,#9b6ee0)}
.cell.end .lab,.cell.start .lab{font-size:clamp(10px,1.2vw,15px)}
.cell .pawns{position:absolute;inset:auto 2px 2px 2px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.cell .pawns .pawn{width:clamp(22px,3vw,38px);height:clamp(22px,3vw,38px);font-size:clamp(12px,1.7vw,20px);border-width:2px}
.cell.has-pawns .ic,.cell.has-pawns .lab{transform:translateY(-30%);opacity:.55}
.pawn.active{animation:bob 1s ease-in-out infinite;z-index:2}
@keyframes bob{50%{transform:translateY(-4px) scale(1.08)}}
.cell.flash{animation:flash .6s ease}
@keyframes flash{40%{box-shadow:0 0 0 4px var(--ink)}}
.board-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.board-foot .note{font-size:20px}
.keys{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;font-weight:800;color:var(--ink-soft)}
.keys span{display:inline-flex;align-items:center;gap:4px}
.keys i{width:12px;height:12px;border-radius:4px;display:inline-block}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.turn{background:var(--surface);border-radius:26px;padding:18px;box-shadow:var(--shadow);border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.turn .who{display:flex;align-items:center;gap:10px}
.turn .who .pawn{width:54px;height:54px;font-size:28px}
.turn h2{font-size:26px}
.turn .zone{font-weight:900;font-size:13px;border-radius:999px;padding:3px 12px;color:#1d2340}
.die{width:96px;height:96px;border-radius:20px;background:var(--surface);border:3px solid var(--ink);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14px;box-shadow:0 6px 0 var(--ink)}
.die i{width:16px;height:16px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die{cursor:pointer;transition:transform .15s}.die:hover{transform:rotate(-6deg) scale(1.06)}.die.rolling{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:rotate(-8deg) translateY(-3px)}75%{transform:rotate(8deg) translateY(2px)}}
.hint{font-size:12px;color:var(--ink-soft);font-weight:700}
.teams{background:var(--surface);border-radius:22px;padding:14px;border:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px;border-radius:14px}
.trow.current{background:var(--surface-2)}
.trow .pawn{width:36px;height:36px;font-size:18px}
.trow .nm{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--m1),var(--m2),var(--m3),var(--m4));background-size:320px 100%}
.stats{display:flex;gap:6px;font-weight:900;font-size:13px}
.stats span{display:inline-flex;align-items:center;gap:3px;background:var(--surface-2);border-radius:99px;padding:2px 8px}
.stats svg{width:14px;height:14px}
.done-badge{font-size:11px;font-weight:900;background:var(--m3);color:#1d2340;border-radius:99px;padding:1px 7px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(14,17,36,.62);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow-y:auto}
.modal{width:min(860px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border-radius:28px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);border:4px solid var(--ink);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:perspective(1400px) rotateY(80deg) scale(.7);opacity:0}60%{transform:perspective(1400px) rotateY(-8deg) scale(1.02)}}
.mhead{padding:18px 22px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:2px dashed var(--line);flex-wrap:wrap}
.mhead .kind{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kind-tag{font-family:var(--font-display);font-size:20px;padding:4px 14px;border-radius:10px;color:#1d2340}
.cat{font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:2px solid currentColor;border-radius:99px;padding:3px 10px}
.mbody{padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.mfoot{padding:14px 22px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:2px dashed var(--line)}
.mfoot .right{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.bigtext{font-size:clamp(22px,3vw,32px);font-weight:900;line-height:1.25;text-wrap:balance}
.question{font-size:clamp(20px,2.6vw,28px);font-weight:800;line-height:1.3}
.question p{margin:0 0 10px}
.prompt{background:var(--surface-2);border-radius:16px;padding:12px 16px;font-weight:700}
.prompt b{font-family:var(--font-display);font-weight:400;font-size:18px;display:block;margin-bottom:4px}
.prompt ul{margin:6px 0 0;padding-left:20px}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper span{font-weight:900;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-soft)}
.stepper span.on{background:var(--brush);color:var(--on-brush)}
.stepper span.ok{background:var(--m3-soft);color:var(--ink)}
.emo-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.emo{border:3px solid transparent;border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--font-display);font-size:15px;color:#1d2340;transition:transform .15s}
.emo svg{width:56px;height:56px}
.emoji-face{display:inline-block;line-height:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.emo .emoji-face{font-size:52px;transition:transform .2s}
.emo:hover .emoji-face{transform:scale(1.18) rotate(-8deg)}
.emo[aria-pressed="true"] .emoji-face{animation:wiggle .6s ease}
@keyframes wiggle{25%{transform:rotate(-14deg) scale(1.2)}75%{transform:rotate(14deg) scale(1.2)}}
.emo:hover{transform:translateY(-2px)}
.emo[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.04);box-shadow:0 6px 0 -1px var(--ink)}
.emo-detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.edcard{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;color:#1d2340;border:3px solid rgba(29,35,64,.15)}
.edcard header{display:flex;align-items:center;gap:8px}
.edcard header svg{width:44px;height:44px;flex:none}
.edcard header .emoji-face{font-size:42px}
.edcard h3{font-size:22px}
.edcard p{margin:0;font-size:14px;font-weight:700}
.edcard ul{margin:0;padding-left:18px;font-size:14px;font-weight:700}
.edcard .q{background:rgba(255,255,255,.55);border-radius:10px;padding:6px 10px;font-weight:900;font-size:14px}
.strat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.strat{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.strat b{font-weight:900}
.strat small{color:var(--ink-soft);font-weight:700;font-size:12.5px}
.strat[aria-pressed="true"]{border-color:var(--m3);background:var(--m3-soft);box-shadow:inset 0 0 0 2px var(--m3)}
.clear-msg{display:grid;gap:8px}
.clear-msg div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:baseline;background:var(--surface-2);border-radius:12px;padding:10px 14px}
.clear-msg div b{font-family:var(--font-display);font-weight:400;font-size:18px}
.clear-msg em{font-style:normal;font-weight:800;color:var(--ink-soft)}
.clear-msg strong{background:var(--m2-soft);border-radius:6px;padding:0 6px}
.tokens{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.token{aspect-ratio:1;border-radius:50%;border:3px dashed rgba(29,35,64,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center;font-weight:900;font-size:12px;line-height:1.1;color:#1d2340;transition:transform .15s}
.token svg{width:28px;height:28px}
.token:hover{transform:scale(1.06) rotate(-3deg)}
.token.suggested{border:3px solid var(--ink)}
.token-won{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-block:10px}
.token-won .token{width:170px;font-size:18px;border-style:solid;animation:spin-in .7s cubic-bezier(.2,1.4,.4,1)}
.token-won .token svg{width:54px;height:54px}
@keyframes spin-in{from{transform:scale(.2) rotate(-200deg)}}
.joker-card{border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:#1d2340;border:3px solid var(--ink);max-width:420px;margin-inline:auto;width:100%}
.joker-card .jt{font-family:var(--font-display);font-size:28px}
.joker-card .jd{font-size:19px;font-weight:800}
.joker-card .jl{background:rgba(255,255,255,.65);border-radius:99px;padding:4px 14px;font-weight:900;font-size:14px}
.jk-list{display:grid;gap:8px}
.jk-list button{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:8px 12px}
.jk-list button b{font-family:var(--font-display);font-weight:400;font-size:17px}
.jk-list small{display:block;color:var(--ink-soft);font-weight:700}
.secret{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.secret .reveal{font-family:var(--font-display);font-size:26px;border-radius:14px;padding:6px 16px;color:#1d2340}
.rank{display:grid;gap:6px;counter-reset:r}
.rank li{list-style:none;display:grid;grid-template-columns:32px 44px minmax(0,1fr) auto;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:4px 8px;font-weight:900}
.rank li::before{counter-increment:r;content:counter(r);font-family:var(--font-display);font-size:20px;text-align:center}
.rank li svg{width:38px;height:38px}
.rank li .emoji-face{font-size:32px;text-align:center}
.rank .mv{display:flex;gap:4px}
.rank .mv button{border:2px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:30px;padding:0;font-weight:900}

.other-teams{font-family:var(--font-hand);font-size:22px;color:var(--ink-soft)}

.rules p{margin:0;font-weight:700;font-size:14.5px}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

.podium{display:grid;gap:10px}

const SAVE_KEY='mission-emotions-v1';

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const zoneOf=p=>p<=0?1:p>=END?4:Math.min(4,Math.ceil(p/10));
const emo=id=>EMOTIONS.find(e=>e.id===id);
function save(){try{if(S)localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function loadSaved(){try{const t=localStorage.getItem(SAVE_KEY);return t?JSON.parse(t):null}catch(e){return null}}
function clearSaved(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function draw(kind){
 const src={situation:SITUATIONS,parlons:PARLONS,defi:DEFIS,joker:JOKERS}[kind];
 if(!S.decks[kind]||!S.decks[kind].length)S.decks[kind]=shuffle(src.map(x=>x.n));
 const n=S.decks[kind].pop();return src.find(x=>x.n===n);
}

/* ================= SON ================= */
let actx=null;
function beep(freqs,dur=.09,type='triangle'){
 if(!ui.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
 let t=actx.currentTime;freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur);t+=dur*.85})}catch(e){}
}
const sfx={step:()=>beep([660],.05),win:()=>beep([523,659,784,1046],.12),token:()=>beep([784,1046,1318],.1),back:()=>beep([440,330],.12,'sine'),open:()=>beep([523,784],.08)};

function renderCells(){
 const cells=[];
 for(let i=0;i<=END;i++){
  const {row,col}=cellPos(i);
  const here=S.teams.map((t,k)=>({t,k})).filter(o=>o.t.pos===i);
  let cls,inner;
  if(i===0){cls='start';inner=`<span class="ce">🏁</span><span class="lab">DÉPART</span>`}
  else if(i===END){cls='end';inner=`<span class="ce">🏆</span><span class="lab">MISSION ACCOMPLIE</span>`}
  else{const ty=LAYOUT[i-1];cls=`z${zoneOf(i)} ${TYPE_INFO[ty].cls}`;inner=`<span class="n">${i}</span><span class="ce">${ty==='S'?Object.values(EMOJI)[i%10]:CELL_EMO[ty]}</span>${TYPE_INFO[ty].lab?`<span class="lab">${TYPE_INFO[ty].lab}</span>`:''}`}
  cells.push(`<div class="cell ${cls} ${here.length?'has-pawns':''}" id="c${i}" style="grid-row:${row+1};grid-column:${col+1}" title="Case ${i}">${inner}
   <div class="pawns">${here.map(o=>`<span class="pawn ${o.k===S.turn?'active':''}" style="background:${o.t.color}" title="${esc(o.t.name)}">${o.t.avatar}</span>`).join('')}</div></div>`);
 }
 return cells.join('');
}
function refreshBoard(flash){const b=$('#board');if(b)b.innerHTML=renderCells();if(flash!=null){const c=$('#c'+flash);c&&c.classList.add('flash')}}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function setDie(v){const d=$('#die');if(!d)return;[...d.children].forEach((p,i)=>p.style.visibility=PIPS[v].includes(i)?'visible':'hidden');d.setAttribute('aria-label','Dé : '+v)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

async function roll(){
 if(ui.busy||ui.modal||S.phase!=='game')return;
 ui.busy=true;$('#rollBtn')&&($('#rollBtn').disabled=true);
 const d=$('#die');d&&d.classList.add('rolling');
 let v=1;for(let k=0;k<(reduced?1:9);k++){v=1+Math.floor(Math.random()*6);setDie(v);beep([300+k*40],.03,'square');await sleep(70)}
 d&&d.classList.remove('rolling');S.lastRoll=v;setDie(v);rollPop(v);
 await moveBy(S.turn,v);
 land();
}
async function moveBy(ti,n){
 const t=S.teams[ti];const dir=Math.sign(n);
 for(let k=0;k<Math.abs(n);k++){
  const np=t.pos+dir;if(np<0||np>END)break;t.pos=np;refreshBoard(np);sfx.step();await sleep(reduced?40:260);
 }
 save();
}
function land(){
 const t=S.teams[S.turn];
 if(t.pos>=END){finishTeam();return}
 const ty=LAYOUT[t.pos-1];
 sfx.open();
 if(ty==='S')openSituation(draw('situation'));
 else if(ty==='P')openParlons(draw('parlons'));
 else if(ty==='D')openDefi(draw('defi'));
 else if(ty==='J')openJoker(draw('joker'));
 else if(ty==='R')openMove(-2);
 else if(ty==='C')openMove(1);
 else if(ty==='B')openKind();
 else if(ty==='Z')openPause();
}
function advance(){
 ui.busy=false;
 if(S.teams.every(t=>t.finished)){S.phase='end';save();return false}
 let i=S.turn;do{i=(i+1)%S.teams.length;if(i===0)S.round++}while(S.teams[i].finished);
 S.turn=i;save();return true;
}
function nextTurn(){
 stopTimer();closeModal();
 if(advance())renderGame();else renderEnd();
}
const showT=()=>S.timer>0||!!ui.timer;

  <div class="mhead"><div class="kind">${body.head}</div><div class="kind">${body.timer?timerHTML():''}<span class="pawn" style="background:${t.color};width:38px;height:38px;font-size:19px">${t.avatar}</span><b>${esc(t.name)}</b></div></div>
  <div class="mbody">${body.html}</div>
  <div class="mfoot">${body.left||''}${['situation','parlons','defi','kind','reward','finish'].includes(m.view)?`<div class="reactions" aria-label="Réactions de la classe"><span class="rl">La classe réagit</span>${REACTS.map(r=>`<button data-a="react" data-v="${r}" aria-label="Réaction ${r}">${r}</button>`).join('')}</div>`:''}<div class="right">${body.foot||''}</div></div></div></div>`;
 if(m.keepScroll){$('.modal').scrollTop=prevScroll;m.keepScroll=false}

}
function rerender(){if(ui.modal){ui.modal.keepScroll=true;renderModal()}}
function jokerBtn(t){return t.jokers.length?`<button class="btn" data-a="usejoker">${I.joker}Utiliser un joker (${t.jokers.length})</button>`:''}
function kindTag(label,bg,em){return `<span class="kind-tag" style="background:${bg}">${em?`<span class="emoji">${em}</span>`:''}${label}</span>`}

/* --- Timer --- */
function timerHTML(){
 const tm=ui.timer;const total=tm?tm.total:S.timer;const left=tm?tm.left:S.timer;
 const r=16,c=2*Math.PI*r,frac=total?left/total:0;
 return `<button class="btn timer ${left<=10&&tm?'low':''}" data-a="timer" aria-label="Sablier">
  <svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="5"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="${left<=10&&tm?'var(--red)':'var(--m1)'}" stroke-width="5" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-frac)}" transform="rotate(-90 20 20)" stroke-linecap="round"/></svg>
  <span id="tleft">${tm?fmt(left):'Sablier '+fmt(S.timer)}</span></button>`;
}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function toggleTimer(){
 if(ui.timer&&ui.timer.id){clearInterval(ui.timer.id);ui.timer.id=null;rerender();return}
 if(!ui.timer||ui.timer.left<=0)ui.timer={total:S.timer,left:S.timer,id:null};
 ui.timer.id=setInterval(()=>{ui.timer.left--;if(ui.timer.left<=0){clearInterval(ui.timer.id);ui.timer.id=null;ui.timer.left=0;beep([880,660,880],.15,'square')}
  const el=$('.mhead .timer');if(el)el.outerHTML=timerHTML()},1000);
 rerender();
}
function stopTimer(){if(ui.timer&&ui.timer.id)clearInterval(ui.timer.id);ui.timer=null}

/* --- Vues --- */
const STEP_NAMES=['Je reconnais','Je comprends','Je cherche une solution','J\'agis'];
const VIEWS={
 situation(m,t){
  const c=m.card,z=m.zone,steps=STEP_NAMES.slice(0,z),step=m.step;
  const head=`${kindTag('SITUATION '+c.n,MISSIONS[z].c,'❓')}<span class="cat" style="color:${CATS[c.cat]}">${c.cat}</span>`;
  const stepper=`<div class="stepper">${steps.map((s,i)=>`<span class="${i===step?'on':i<step?'ok':''}">${i+1}. ${s}</span>`).join('')}<span class="${step===steps.length?'on':''}">Jeton</span></div>`;
  let html=`<div class="bigtext">${esc(c.text)}</div>${stepper}`;
  let foot='',left=jokerBtn(t);
  const name=steps[step];
  if(step>=steps.length)return VIEWS.reward(m,t);
  if(name==='Je reconnais'){
   html+=`<div class="prompt"><b>Mission ${z} · Je reconnais</b>Quelle(s) émotion(s) peut-on ressentir dans cette situation ? Choisis jusqu'à 3 émotions, puis explique ton choix.</div>
   <div class="emo-grid">${EMOTIONS.map(e=>`<button class="emo" style="background:${e.color}" data-a="pickemo" data-v="${e.id}" aria-pressed="${m.emos.includes(e.id)}">${face(e.id,e.color)}${e.name}</button>`).join('')}</div>`;
   if(z===1)html+=`<div class="prompt"><b>Pour aller plus loin</b>Comment reconnais-tu cette émotion ? Qu'est-ce que tu pourrais faire ?</div>`;
  }else if(name==='Je comprends'){
   html+=`<div class="emo-detail">${m.emos.map(id=>{const e=emo(id);return `<div class="edcard" style="background:${e.color}"><header>${face(e.id,e.color)}<h3>${e.name}</h3></header><p>Je ressens ${e.art} ${e.name.toLowerCase()} ${e.def}</p><p>Je peux ressentir :</p><ul>${e.feel.map(f=>`<li>${f}</li>`).join('')}</ul><div class="q">${e.q}</div></div>`}).join('')}</div>
   <div class="prompt"><b>Mission 2 · Je comprends</b><ul><li>Qu'est-ce qui, dans cette situation, déclenche cette émotion ?</li><li>Comment le corps réagit-il (cœur, mains, voix, envie de…) ?</li><li>À quoi sert cette émotion ? Qu'est-ce qu'elle nous signale ?</li></ul></div>`;
  }else if(name==='Je cherche une solution'){
   html+=`<div class="prompt"><b>Mission 3 · Je cherche une solution</b>Quelle réaction serait adaptée ? Choisis 1 ou 2 solutions et explique pourquoi. Tu peux aussi en inventer une autre.</div>
   <div class="strat-grid">${STRATS.map(s=>`<button class="strat" data-a="pickstrat" data-v="${s.id}" aria-pressed="${m.strats.includes(s.id)}"><b>${s.t}</b><small>${s.d}</small></button>`).join('')}</div>`;
  }else if(name==='J\'agis'){
   const e=m.emos.map(id=>emo(id).name.toLowerCase()).join(' et ')||'…';
   const st=m.strats.map(id=>STRATS[id].t.toLowerCase()).join(', puis ')||'…';
   html+=`<div class="prompt"><b>Mission 4 · J'agis</b>Mets-toi en situation : joue la scène en 30 secondes avec un coéquipier, ou dis à voix haute ce que tu dirais vraiment, avec le message clair.</div>
   <div class="clear-msg">
    <div><b>Quand…</b><span><em>je décris les faits, sans juger ni accuser :</em> « Quand … »</span></div>
    <div><b>Je ressens…</b><span>« …je ressens <strong>${esc(e)}</strong>. »</span></div>
    <div><b>J'ai besoin…</b><span><em>je dis ce dont j'ai besoin :</em> « J'ai besoin de … »</span></div>
    <div><b>Je propose…</b><span>« Je vais <strong>${esc(st)}</strong>. Est-ce que tu pourrais … ? »</span></div>
   </div>`;
  }
  html+=`<p class="other-teams">Les autres équipes donnent leur avis, écoutent et proposent des idées.</p>`;
  const canNext=name!=='Je reconnais'||m.emos.length>0;
  foot=`${step>0?'<button class="btn" data-a="sitprev">Retour</button>':''}<button class="btn btn-primary" data-a="sitnext" ${canNext?'':'disabled'}>${step===steps.length-1?'Mission réussie !':'Étape suivante'}</button>`;
  return {label:'Carte situation',head,html,foot,left,timer:showT()};
 },
 parlons(m,t){
  const c=m.card;
  return {label:'Parlons-en',head:kindTag('PARLONS-EN','var(--m3)','💬'),timer:showT(),
   html:`<div class="question">${c.lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>
   <div class="prompt"><b>On en parle ensemble</b>L'équipe répond d'abord, puis chaque équipe peut ajouter une idée. Chacun peut passer s'il ne se sent pas à l'aise.</div>`,
   left:jokerBtn(t),foot:`<button class="btn btn-primary" data-a="toreward">On en a parlé !</button>`};
 },
 defi(m,t){
  const c=m.card;let extra='';
  if(c.special==='secret'){
   const e=m.secret?emo(m.secret):null;
   extra=`<div class="prompt"><b>Émotion secrète</b>Seul le joueur qui relève le défi regarde l'écran.<div class="secret" style="margin-top:8px">
    ${e&&m.show?`<span class="reveal" style="background:${e.color}">${e.name}</span><button class="btn" data-a="hidesecret">Cacher</button>`:`<button class="btn" data-a="showsecret">Tirer une émotion secrète</button>`}</div></div>`;
  }else if(c.special==='rank10'||c.special==='rank5'){
   extra=`<div class="rank-ends"><span>Plus agréable</span><span>Moins agréable</span></div><ol class="rank" style="padding:0;margin:0">${m.rank.map((id,i)=>{const e=emo(id);return `<li>${face(e.id,e.color)}<span>${e.name}</span><span class="mv"><button data-a="rankup" data-v="${i}" aria-label="Monter ${e.name}" ${i===0?'disabled':''}>↑</button><button data-a="rankdown" data-v="${i}" aria-label="Descendre ${e.name}" ${i===m.rank.length-1?'disabled':''}>↓</button></span></li>`}).join('')}</ol>
   <div class="prompt"><b>Explique ton choix</b>Une émotion « désagréable » n'est pas une mauvaise émotion : toutes ont une fonction.</div>`;
  }else if(c.special==='situation'){
   extra=`<div class="prompt"><b>La situation</b><span style="font-size:20px">${esc(m.sit.text)}</span></div>`;
  }
  return {label:'Carte défi',head:`${kindTag('DÉFI '+c.n,'var(--orange)','🎯')}<span class="cat" style="color:var(--orange)">${esc(c.tag)}</span>`,timer:showT(),
   html:`<div class="bigtext">${esc(c.text)}</div>${extra}`,
   left:jokerBtn(t),foot:`<button class="btn" data-a="defifail">Pas cette fois</button><button class="btn btn-primary" data-a="toreward">Défi relevé !</button>`};
 },
 joker(m,t){
  const c=m.card;const bg=JK_COLORS[c.n%JK_COLORS.length];
  return {label:'Carte joker',head:kindTag('JOKER','var(--surface-2)','🃏'),
   html:`<div class="joker-card" style="background:${bg}"><span class="label" style="color:#1d2340">Joker ${c.n}</span><span class="jt">${esc(c.title)}</span><span class="jd">${esc(c.text)}</span><span class="jl">${esc(c.tag)}</span></div>
   <p style="text-align:center;font-weight:800;margin:0">${c.effect==='bonus'?'Ce joker s\'utilise tout de suite : ton pion avance de 2 cases.':'Ton équipe garde ce joker et peut l\'utiliser pendant une prochaine carte.'}</p>`,
   foot:`<button class="btn btn-primary" data-a="${c.effect==='bonus'?'bonus':'keepjoker'}">${c.effect==='bonus'?'Avancer de 2 cases':'Garder le joker'}</button>`};
 },
 move(m,t){
  const back=m.n<0;
  return {label:back?'Retour':'Chance',head:kindTag(back?'RETOUR EN ARRIÈRE':'CASE CHANCE',back?'var(--pink)':'var(--m2)',back?'⏪':'⭐'),
   html:`<div class="move-msg"><span class="big-emo emoji">${back?'🙃':'🍀'}</span><span class="big">${back?'−2':'+1'}</span><div class="bigtext">${back?'Tu recules de 2 cases.':'Tu avances d\'une case !'}</div><p class="note">${back?'Pas grave : l\'essentiel, c\'est le chemin parcouru !':'Chaque petit pas est une grande victoire !'}</p></div>`,
   foot:`<button class="btn btn-primary" data-a="domove">${back?'Reculer':'Avancer'}</button>`};
 },
 kind(m,t){
  const others=S.teams.map((x,i)=>({x,i})).filter(o=>o.i!==S.turn);
  return {label:'Bienveillance',head:kindTag('CASE BIENVEILLANCE','var(--pink-soft)','💖'),
   html:`<div class="bigtext">Dis un mot gentil à un joueur d'une autre équipe.</div>
   <div><span class="label">À qui ?</span><div class="pick-team" style="margin-top:6px">${others.map(o=>`<button data-a="kindto" data-v="${o.i}" aria-pressed="${m.to===o.i}"><span class="pawn" style="background:${o.x.color}">${o.x.avatar}</span>${esc(o.x.name)}</button>`).join('')}</div></div>
   <div><span class="label">Des idées</span><div class="kind-words" style="margin-top:6px">${KIND_WORDS.map(w=>`<span>${w}</span>`).join('')}</div></div>
   <p class="note">Un petit geste, un grand effet !</p>`,
   foot:`<button class="btn btn-primary" data-a="toreward">C'est dit !</button>`};
 },
 pause(m,t){
  return {label:'Pause',head:kindTag('CASE PAUSE','color-mix(in srgb,var(--teal) 45%,var(--surface))','😌'),
   html:`<div class="bigtext" style="text-align:center">Respire un grand coup avec toute la classe.</div>
   <div class="breath"><div class="circle ${m.phase==='in'?'in':''}" id="breathCircle">${m.running?(m.phase==='in'?'Inspire…':'Souffle…'):'😌 Prêts ?'}</div>
   <span class="count">${m.running?`Respiration ${m.cycle} sur 3`:m.done?'Bravo, on est plus calmes !':'3 grandes respirations : 4 secondes pour inspirer, 4 pour souffler.'}</span>
   ${m.running?'':`<button class="btn" data-a="breathe" data-focus>${m.done?'Recommencer':'Commencer la respiration'}</button>`}</div>
   <div class="prompt"><b>Ou bien</b>Partage une astuce qui t'aide à te détendre.</div>`,
   foot:`<button class="btn btn-primary" data-a="endturn">Passer mon tour</button>`};
 },
 reward(m,t){
  const sug=m.suggest??0;
  if(m.won!=null){const k=TOKENS[m.won];
   return {label:'Jeton gagné',head:kindTag('JETON MISSION RÉUSSIE','var(--m2)','🏅'),
    html:`<div class="token-won"><div class="token" style="background:${k.c}">${tokIcon(k.i)}${esc(k.t)}</div><div class="bigtext">${esc(t.name)} gagne un jeton !</div><p class="note">Des émotions aujourd'hui pour des réussites demain !</p></div>`,
    foot:`<button class="btn btn-primary" data-a="endturn">Joueur suivant</button>`}}
  return {label:'Choisir un jeton',head:kindTag('JETONS MISSION RÉUSSIE','var(--m2)','🏅'),
   html:`<div class="prompt"><b>Bravo pour tes efforts !</b>L'enseignant(e) ou la classe choisit le jeton qui correspond le mieux à ce qui vient de se passer.</div>
   <div class="tokens">${TOKENS.map(k=>`<button class="token ${k.id===sug?'suggested':''}" style="background:${k.c}" data-a="givetoken" data-v="${k.id}">${tokIcon(k.i)}${esc(k.t)}</button>`).join('')}</div>`,
   foot:`<button class="btn" data-a="endturn">Continuer sans jeton</button>`};
 },
 jokers(m,t){
  return {label:'Jokers',head:kindTag('MES JOKERS','var(--surface-2)'),
   html:`<div class="jk-list">${t.jokers.map((n,i)=>{const j=JOKERS.find(x=>x.n===n);return `<button data-a="playjoker" data-v="${i}">${I.joker}<span><b>${esc(j.title)}</b><small>${esc(j.text)}</small></span></button>`}).join('')}</div>`,
   foot:`<button class="btn" data-a="backjoker">Retour à la carte</button>`};
 },
 jokerPlayed(m,t){
  const j=m.joker;const bg=JK_COLORS[j.n%JK_COLORS.length];
  return {label:'Joker utilisé',head:kindTag('JOKER UTILISÉ','var(--surface-2)'),
   html:`<div class="joker-card" style="background:${bg}"><span class="jt">${esc(j.title)}</span><span class="jd">${esc(j.text)}</span><span class="jl">${esc(j.tag)}</span></div>
   ${j.effect==='emotions'?`<div class="ref-grid">${EMOTIONS.map(e=>emoCard(e)).join('')}</div>`:''}
   ${j.effect==='solutions'?`<div class="strat-grid">${STRATS.map(s=>`<div class="strat"><b>${s.t}</b><small>${s.d}</small></div>`).join('')}</div>`:''}
   ${j.effect==='choose'?`<div class="jk-list">${m.choices.map(s=>`<button data-a="choosesit" data-v="${s.n}"><span><b>Situation ${s.n} · ${s.cat}</b><small style="font-size:15px;color:var(--ink)">${esc(s.text)}</small></span></button>`).join('')}</div>`:''}`,
   foot:j.effect==='skip'?`<button class="btn btn-primary" data-a="endturn">Passer mon tour</button>`:j.effect==='choose'?'':`<button class="btn btn-primary" data-a="backjoker">Retour à la carte</button>`};
 },
 finish(m,t){
  return {label:'Mission accomplie',head:kindTag('MISSION ACCOMPLIE !','linear-gradient(90deg,#f2bd2c,#ef5f8a)','🏆'),
   html:`<div class="move-msg"><span class="pawn" style="background:${t.color};width:90px;height:90px;font-size:46px">${t.avatar}</span>
   <div class="bigtext">${esc(t.name)} arrive ${t.finished===1?'en premier':'n°'+t.finished} !</div>
   <p style="font-weight:800;margin:0;max-width:46ch">Mais dans ce jeu, tout le monde est gagnant : chacun apprend et partage. L'essentiel, c'est le chemin parcouru !</p>
   <p class="note">Je progresse chaque jour !</p></div>`,
   foot:`<button class="btn" data-a="bilan">Voir le bilan</button>${S.teams.some(x=>!x.finished)?'<button class="btn btn-primary" data-a="endturn">Continuer la partie</button>':''}`};
 },
};
function emoCard(e){return `<div class="edcard" style="background:${e.color}"><header>${face(e.id,e.color)}<h3>${e.name}</h3></header><p>Je ressens ${e.art} ${e.name.toLowerCase()} ${e.def}</p><p>Je peux ressentir :</p><ul>${e.feel.map(f=>`<li>${f}</li>`).join('')}</ul><div class="q">${e.q}</div></div>`}

function openSituation(card){stopTimer();openModal({view:'situation',card,zone:zoneOf(S.teams[S.turn].pos),step:0,emos:[],strats:[],kind:'situation'})}
function openParlons(card){stopTimer();openModal({view:'parlons',card,kind:'parlons',suggest:6})}
function openDefi(card){stopTimer();const m={view:'defi',card,kind:'defi',suggest:5};
 if(card.special==='rank10')m.rank=shuffle(EMOTIONS.map(e=>e.id));
 if(card.special==='rank5')m.rank=shuffle(['joie','fierte','surprise','tristesse','colere']);
 if(card.special==='situation')m.sit=DIFFICULT[Math.floor(Math.random()*DIFFICULT.length)];
 openModal(m)}
function openJoker(card){openModal({view:'joker',card})}
function openMove(n){openModal({view:'move',n})}
function openKind(){openModal({view:'kind',to:null,kind:'kind',suggest:21})}
function openPause(){openModal({view:'pause',running:false,cycle:0,phase:'out'})}
async function breathe(){
 const m=ui.modal;m.running=true;m.done=false;m.cycle=1;m.phase='out';renderModal();
 const set=(cls,txt,c)=>{const el=$('#breathCircle'),ct=$('.breath .count');if(!el)return;el.classList.toggle('in',cls);el.textContent=txt;if(ct)ct.textContent=`Respiration ${c} sur 3`};
 await sleep(60);
 for(let c=1;c<=3;c++){
  if(ui.modal!==m)return;m.cycle=c;m.phase='in';set(true,'🌬️ Inspire…',c);beep([392],.2,'sine');await sleep(4000);
  if(ui.modal!==m)return;m.phase='out';set(false,'😮‍💨 Souffle…',c);beep([294],.2,'sine');await sleep(4000);
 }
 if(ui.modal!==m)return;m.running=false;m.done=true;renderModal();
}
function finishTeam(){
 const t=S.teams[S.turn];t.pos=END;S.finishOrder++;t.finished=S.finishOrder;save();sfx.win();confetti();
 openModal({view:'finish'});
}

/* ================= ÉVÉNEMENTS ================= */
document.addEventListener('input',e=>{const i=e.target.dataset.team;if(i!=null&&e.target.tagName==='INPUT')setupDraft.teams[i].name=e.target.value});
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const a=b.dataset.a,v=b.dataset.v;const m=ui.modal;const t=S&&S.teams[S.turn];
 switch(a){
  case 'count':setupDraft.count=+v;renderSetup();break;
  case 'avatar':setupDraft.teams[b.dataset.team].avatar=v;renderSetup();break;
  case 'timer':if(ui.modal&&S&&S.phase==='game'){toggleTimer()}else{setupDraft.timer=+v;renderSetup()}break;
  case 'start':startGame();break;
  case 'resume':S=loadSaved();ui.busy=false;S.phase==='end'?renderEnd():renderGame();break;
  case 'discard':clearSaved();renderSetup();break;
  case 'rules':showRules();break;
  case 'emotions':showEmotions();break;
  case 'closeinfo':$('#info')&&$('#info').remove();break;
  case 'sound':ui.sound=!ui.sound;renderGame();break;
  case 'newgame':askNew();break;
  case 'confirmnew':$('#info')&&$('#info').remove();S=null;clearSaved();ui.busy=false;closeModal();stopTimer();renderSetup();break;
  case 'roll':roll();break;
  case 'pickemo':{const i=m.emos.indexOf(v);if(i>=0)m.emos.splice(i,1);else if(m.emos.length<3)m.emos.push(v);else toast('3 émotions maximum');rerender();break}
  case 'pickstrat':{const id=+v;const i=m.strats.indexOf(id);if(i>=0)m.strats.splice(i,1);else if(m.strats.length<2)m.strats.push(id);else toast('2 solutions maximum');rerender();break}
  case 'sitnext':m.step++;if(m.step>=m.zone){recordSituation(m);m.view='reward';m.suggest=suggestToken(m)}renderModal();break;
  case 'sitprev':m.step=Math.max(0,m.step-1);renderModal();break;
  case 'toreward':if(m.kind==='defi')S.stats.defis++;if(m.kind==='parlons')S.stats.parlons++;S.stats.cards++;m.view='reward';stopTimer();renderModal();break;
  case 'defifail':toast('Pas grave, tu réessaieras !');nextTurn();break;
  case 'givetoken':t.tokens.push(+v);m.won=+v;sfx.token();save();renderModal();burst(['🎉','⭐','✨','🏅','💛'],innerWidth/2,innerHeight/2,14);break;
  case 'react':burst([v],e.clientX||innerWidth/2,e.clientY||innerHeight/2,5);beep([600+Math.random()*500],.06);break;
  case 'moodpick':setupDraft.teams[b.dataset.team].mood=v;renderSetup();break;
  case 'endturn':nextTurn();break;
  case 'keepjoker':t.jokers.push(m.card.n);save();toast(`${t.name} garde le joker « ${m.card.title} »`);nextTurn();break;
  case 'bonus':closeModal();await moveBy(S.turn,Math.min(2,END-t.pos));if(t.pos>=END)finishTeam();else nextTurn();break;
  case 'domove':{const n=m.n;closeModal();if(n<0)sfx.back();await moveBy(S.turn,n);if(t.pos>=END)finishTeam();else nextTurn();break}
  case 'kindto':m.to=+v;rerender();break;
  case 'breathe':breathe();break;
  case 'showsecret':if(!m.secret)m.secret=EMOTIONS[Math.floor(Math.random()*EMOTIONS.length)].id;m.show=true;rerender();break;
  case 'hidesecret':m.show=false;rerender();break;
  case 'rankup':case 'rankdown':{const i=+v,j=a==='rankup'?i-1:i+1;[m.rank[i],m.rank[j]]=[m.rank[j],m.rank[i]];rerender();break}
  case 'usejoker':m.prev=m.view;m.view='jokers';renderModal();break;
  case 'backjoker':m.view=m.prev;renderModal();break;
  case 'playjoker':playJoker(+v);break;
  case 'choosesit':{const s=SITUATIONS.find(x=>x.n===+v);openSituation(s);break}
  case 'bilan':stopTimer();if(ui.modal){closeModal();advance()}renderEnd();break;
  case 'backgame':S.phase='game';save();renderGame();break;
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#info')){$('#info').remove();return}
 if((e.code==='Space')&&S&&S.phase==='game'&&!ui.modal&&!$('#info')&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();roll()}
});
function playJoker(i){
 const t=S.teams[S.turn],m=ui.modal;const n=t.jokers.splice(i,1)[0];const j=JOKERS.find(x=>x.n===n);save();
 if(j.effect==='swap'){toast('Nouvelle carte !');if(m.kind==='situation')openSituation(draw('situation'));else if(m.kind==='defi')openDefi(draw('defi'));else openParlons(draw('parlons'));return}
 if(j.effect==='time'){if(ui.timer){ui.timer.left+=60;ui.timer.total+=60}else{ui.timer={total:S.timer+60||60,left:S.timer+60||60,id:null}}toast('+1 minute au sablier')}
 if(j.effect==='choose'){m.choices=shuffle(SITUATIONS).slice(0,3)}
 m.joker=j;m.view='jokerPlayed';if(!m.prev||m.prev==='jokers')m.prev='situation';renderModal();
}
function recordSituation(m){
 S.stats.cards++;m.emos.forEach(id=>S.stats.emo[id]=(S.stats.emo[id]||0)+1);m.strats.forEach(id=>S.stats.strat[id]=(S.stats.strat[id]||0)+1);save();
}
function suggestToken(m){
 if(m.zone===1)return 6; if(m.zone===2)return 15; if(m.zone===3)return 3; return 19;
}

 $('#info')&&$('#info').remove();

 d.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="${esc(title)}" style="z-index:70"><div class="modal"><div class="mhead"><h2>${title}</h2><button class="btn" data-a="closeinfo" data-focus>Fermer</button></div><div class="mbody">${html}</div></div></div>`;
 document.body.appendChild(d);d.querySelector('[data-focus]').focus();
}

 infoLayer('Règles du jeu',`<div class="rules">

  <section><h3>Fin du jeu</h3><p>La première équipe sur la case Mission accomplie a gagné… mais tout le monde est gagnant, car chacun apprend et partage. L'essentiel, c'est le chemin parcouru !</p></section>
  <section><h3>Nos engagements</h3><ul><li>Écouter sans se moquer.</li><li>Respecter la parole de chacun.</li><li>Être bienveillant.</li><li>Partager nos idées.</li><li>Laisser la possibilité de passer son tour.</li><li>Profiter du moment !</li></ul></section>
 </div><p class="note" style="text-align:center">Il n'y a pas de bonne ou de mauvaise réponse. On partage et on s'écoute !</p>`);

function askNew(){infoLayer('Nouvelle partie ?',`<p class="bigtext" style="font-size:22px">La partie en cours sera effacée.</p><div class="field-row"><button class="btn btn-primary" data-a="confirmnew">Oui, nouvelle partie</button><button class="btn" data-a="closeinfo">Annuler</button></div>`)}

/* ================= BILAN ================= */
function renderEnd(){
 if(S.teams.every(t=>t.finished))S.phase='end';save();
 const ranked=S.teams.slice().sort((a,b)=>(a.finished||99)-(b.finished||99)||b.pos-a.pos);
 const emoRows=EMOTIONS.map(e=>({e,n:S.stats.emo[e.id]||0})).sort((a,b)=>b.n-a.n);
 const maxE=Math.max(1,...emoRows.map(r=>r.n));
 const stratRows=Object.entries(S.stats.strat).map(([id,n])=>({s:STRATS[id],n})).sort((a,b)=>b.n-a.n).slice(0,6);
 const maxS=Math.max(1,...stratRows.map(r=>r.n));
 const totalTok=S.teams.reduce((s,t)=>s+t.tokens.length,0);
 $('#app').innerHTML=`
 <header class="topbar"><span class="logo"><span class="brush">MISSION <span class="rainbow">${[...'ÉMOTIONS'].map(c=>`<span>${c}</span>`).join('')}</span></span></span>
  <div class="tools">${S.teams.some(t=>!t.finished)?'<button class="btn" data-a="backgame">Retour au plateau</button>':''}<button class="btn btn-primary" data-a="confirmnew">${I.reset}Nouvelle partie</button></div></header>
 <main style="display:grid;gap:20px">
  <section class="panel"><h2>Bilan de la mission</h2>
   <p style="margin:0;font-weight:800;font-size:18px">${S.stats.cards} cartes jouées · ${totalTok} jetons gagnés · ${Object.values(S.stats.emo).reduce((a,b)=>a+b,0)} émotions nommées · ${S.stats.defis} défis relevés</p>
   <div class="podium">${ranked.map(t=>`<div class="prow"><span class="pawn" style="background:${t.color}">${t.avatar}</span><div style="min-width:0"><h3>${esc(t.name)} ${t.finished?`<span class="done-badge">Arrivée n°${t.finished}</span>`:`<span class="hint">case ${t.pos}</span>`}</h3>
    <div class="mini-tokens">${t.tokens.length?t.tokens.map(id=>`<span style="background:${TOKENS[id].c}">${esc(TOKENS[id].t)}</span>`).join(''):'<span class="empty">Pas encore de jeton</span>'}</div></div></div>`).join('')}</div>
  </section>
  <div class="two">
   <section class="panel"><h2>Les émotions nommées</h2>
    ${emoRows.some(r=>r.n)?`<div class="chart">${emoRows.map(r=>`<div class="row"><span>${r.e.name}</span><span class="track"><i style="width:${r.n/maxE*100}%;background:${r.e.color}"></i></span><span class="v">${r.n}</span></div>`).join('')}</div>`:'<p class="empty">Les émotions choisies sur les cartes situations apparaîtront ici.</p>'}
   </section>
   <section class="panel"><h2>Les solutions choisies</h2>
    ${stratRows.length?`<div class="chart">${stratRows.map(r=>`<div class="row" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 28px"><span>${r.s.t}</span><span class="track"><i style="width:${r.n/maxS*100}%;background:var(--m3)"></i></span><span class="v">${r.n}</span></div>`).join('')}</div>`:'<p class="empty">Les solutions apparaissent à partir de la mission 3 (cases 21 à 40).</p>'}
   </section>
  </div>
  <section class="panel"><h2>Temps d'échange</h2>
   <div class="rules">
    <section><h3>Ce que j'ai appris</h3><ul><li>Quelle émotion a été la plus difficile à reconnaître ?</li><li>Une situation qui t'a fait réfléchir ?</li></ul></section>
    <section><h3>Ce que je retiens</h3><ul><li>Une solution que tu pourrais utiliser cette semaine ?</li><li>Au lycée, en stage, à la maison : où en aurais-tu besoin ?</li></ul></section>
    <section><h3>Les autres</h3><ul><li>Une idée d'un camarade qui t'a aidé ?</li><li>Comment t'es-tu senti(e) pendant le jeu ?</li></ul></section>
    <section><h3>Mon passeport</h3><p>Chacun complète son passeport élève : une émotion, une solution, une fierté.</p></section>
   </div>
   <p class="note" style="text-align:center">Des élèves plus sereins, plus confiants, plus solidaires… Mission émotions : grandir ensemble !</p>
  </section>
 </main>`;
}

/* ================= CONFETTIS ================= */
function confetti(){
 if(reduced)return;const cv=$('#confetti');cv.hidden=false;const ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 const cols=['#3d97e8','#f2bd2c','#4fbf6c','#9b6ee0','#ef5f8a','#f5873a'];
 const ps=Array.from({length:160},()=>({x:cv.width/2,y:cv.height*.35,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,s:6+Math.random()*7,c:cols[Math.floor(Math.random()*6)],r:Math.random()*6,vr:(Math.random()-.5)*.4,e:Math.random()<.22?['😄','🎉','⭐','🏆','💖','😎'][Math.floor(Math.random()*6)]:null}));
 let f=0;(function tick(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);if(p.e){ctx.font=(p.s*3)+'px sans-serif';ctx.fillText(p.e,0,0)}else{ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}ctx.restore()});
 if(++f<170)requestAnimationFrame(tick);else{ctx.clearRect(0,0,cv.width,cv.height);cv.hidden=true}})();
}

function rollPop(v){const d=document.createElement('div');d.className='rollpop';d.innerHTML=`<span class="emoji">🎲</span> ${v} !`;document.body.appendChild(d);setTimeout(()=>d.remove(),1150)}
function burst(list,x,y,n){if(reduced)n=Math.min(n,2);for(let k=0;k<n;k++){const f=document.createElement('span');f.className='fly';f.textContent=list[k%list.length];
 f.style.left=(x-19+(Math.random()-.5)*60)+'px';f.style.top=(y-19)+'px';f.style.setProperty('--dx',((Math.random()-.5)*240)+'px');f.style.setProperty('--rot',((Math.random()-.5)*80)+'deg');f.style.animationDelay=(k*0.05)+'s';
 document.body.appendChild(f);setTimeout(()=>f.remove(),1800+k*50)}}
(function floaters(){const box=document.getElementById('floaters');const em=['😄','😢','😠','😨','😲','🤢','😤','😰','😎','😞','💛','⭐','💬','🎲'];
 box.innerHTML=em.map((e,i)=>`<span style="left:${(i*7.3+3)%96}%;--sz:${26+(i*7)%26}px;--d:${18+(i*5)%16}s;--dl:-${(i*3.1)%20}s;${reduced?`top:${(i*13)%90}%;animation:none`:''}">${e}</span>`).join('')})();
/* ================= DÉMARRAGE ================= */
function start(data){
 if(data&&data.S){S=data.S;ui.busy=false;S.phase==='end'?renderEnd():renderGame();return}
 renderSetup();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
